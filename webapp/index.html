<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Demo Offline Ordini</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{"offlinedemo": "./"}'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-preload="async"
        data-sap-ui-frame-options="trusted"
        data-sap-ui-libs="sap.m,sap.ui.core"
    ></script>

    <script>
        // Registrazione SW: scope esplicito nella stessa cartella dell'index.html.
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("./service-worker.js", { scope: "./" })
                    .then((reg) => {
                        console.log("[SW] registrato. Scope:", reg.scope);
                    })
                    .catch((err) => {
                        console.warn("[SW] registrazione fallita:", err);
                    });
            });
        }
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="offlinedemo"
        data-id="container"
        data-settings='{"id" : "offlinedemo"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
