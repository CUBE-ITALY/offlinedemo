specVersion: "4.0"
metadata:
  name: offlinedemo
type: application
framework:
  name: SAPUI5
  version: 1.148.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
